name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      - run: pnpm check
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A free license key is required when an organization owns the repository.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
